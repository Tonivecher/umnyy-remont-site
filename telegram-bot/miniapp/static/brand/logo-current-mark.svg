<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Монограмма УР</title>
  <desc id="desc">Прозрачная золотая монограмма УР для использования на тёмных и светлых носителях.</desc>

  <defs>
