      <stop offset="0" stop-color="#f1d48a"/>
      <stop offset="0.48" stop-color="#d6b36a"/>
      <stop offset="1" stop-color="#9e7b36"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
